name: Publier et vérifier Élan sur GitHub Pages

on:
  push:
    branches: [elan-publication]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: elan-pages-publication
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/elan-publication'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    outputs:
      config_outcome: ${{ steps.pages.outcome }}
      deploy_outcome: ${{ steps.deployment.outcome }}
      page_url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Lire le paquet de publication
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4, vérifié par git ls-remote
      - name: Configurer Pages et tenter son activation autorisée
        id: pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
        with:
          enablement: true
      - name: Vérifier le sous-chemin Pages et le paquet web/Android exact
        env:
          PAGES_CONFIGURED_BASE_PATH: ${{ steps.pages.outputs.base_path }}
        run: node scripts/publication/assert-pages.mjs
      - name: Fournir uniquement les fichiers applicatifs de site
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: site
      - name: Déployer le paquet vérifié
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4

  report:
    if: always() && github.ref == 'refs/heads/elan-publication'
    needs: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      actions: read
      checks: read
    steps:
      - name: Lire le même commit de publication
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Vérifier la page HTTPS et chaque ressource par SHA256
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PAGES_CONFIG_OUTCOME: ${{ needs.deploy.outputs.config_outcome }}
          PAGES_DEPLOY_OUTCOME: ${{ needs.deploy.outputs.deploy_outcome }}
          PAGES_DEPLOY_JOB_OUTCOME: ${{ needs.deploy.result }}
          PAGES_PAGE_URL: ${{ needs.deploy.outputs.page_url }}
        run: node scripts/publication/report.mjs
      - name: Persister le résultat exact dans une branche de statut séparée
        run: node scripts/publication/persist-status.mjs
      - name: Exiger une vérification publique réussie
        run: node --input-type=module -e "import {readFile} from 'node:fs/promises'; const report=JSON.parse(await readFile('publication-status.json','utf8')); if(report.verificationPassed!==true) process.exit(1);"
