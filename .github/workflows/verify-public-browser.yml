name: Vérifier le parcours public Élan

on:
  push:
    branches: [elan-browser-check]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: elan-public-browser-recipe
  cancel-in-progress: false

jobs:
  browser:
    if: github.ref == 'refs/heads/elan-browser-check'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Lire les outils et les empreintes du site publié
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4 épinglée
      - name: Installer le navigateur et la version exacte de Playwright
        id: tools
        run: |
          npm install --prefix "$RUNNER_TEMP/elan-browser-deps" --no-save --no-package-lock --ignore-scripts --no-audit --no-fund @playwright/test@1.64.1
          node "$RUNNER_TEMP/elan-browser-deps/node_modules/playwright/cli.js" install --with-deps chromium
          cp scripts/publication/public-browser-smoke.mjs "$RUNNER_TEMP/elan-browser-deps/public-browser-smoke.mjs"
      - name: Jouer sur l’adresse publique et vérifier la sauvegarde hors ligne
        id: recipe
        continue-on-error: true
        env:
          ELAN_SMOKE_OUTPUT_DIR: ${{ github.workspace }}
          ELAN_SMOKE_PACKAGE_ROOT: ${{ github.workspace }}
          ELAN_EXPECTED_BUILD_SHA256: 81ba7e5f9168d5151b222884a830e54794b3a746f70504f520f3ffb7f878d7c7
          ELAN_EXPECTED_WEB_FILE_COUNT: 35
          ELAN_EXPECTED_FILE_COUNT: 37
        run: node "$RUNNER_TEMP/elan-browser-deps/public-browser-smoke.mjs"
      - name: Conserver aussi un échec d’installation ou d’exécution
        if: always()
        env:
          RECIPE_OUTCOME: ${{ steps.recipe.outcome }}
          TOOLS_OUTCOME: ${{ steps.tools.outcome }}
        run: |
          node --input-type=module <<'NODE'
          import { access, writeFile } from 'node:fs/promises';
          try { await access('browser-status.json'); }
          catch {
            await writeFile('browser-status.json', JSON.stringify({
              format: 'elan-public-browser-recipe', version: 3,
              scenario: 'animated-example-android-0.2.1-and-difficulty-levels-1-to-3',
              createdAt: new Date().toISOString(), passed: false,
              repository: process.env.GITHUB_REPOSITORY,
              sourceCommit: process.env.GITHUB_SHA,
              workflowRunId: process.env.GITHUB_RUN_ID,
              buildSha256: '81ba7e5f9168d5151b222884a830e54794b3a746f70504f520f3ffb7f878d7c7',
              url: 'https://gillesarnaudasse65-web.github.io/elan-app/',
              deployedToPublicURL: false, physicalDeviceTested: false,
              error: 'Aucun rapport navigateur produit ; installation=' + process.env.TOOLS_OUTCOME + ', recette=' + process.env.RECIPE_OUTCOME
            }, null, 2) + '\n');
          }
          NODE
      - name: Persister la preuve sur une branche séparée sans force
        if: always()
        run: node scripts/publication/persist-browser-status.mjs
      - name: Exiger la réussite de la vraie recette publique
        if: always()
        run: node --input-type=module -e "import {readFile} from 'node:fs/promises'; const report=JSON.parse(await readFile('browser-status.json','utf8')); if(report.passed!==true || report.deployedToPublicURL!==true || report.androidDownloadVerified!==true || report.modernInterfaceVerified!==true || report.dashboardWidgetsVerified!==true || report.activityJourneyVerified!==true || report.apkExcludedFromPwaCache!==true || report.animatedDemonstrationVerified!==true || report.demoPauseVerified!==true || report.demoDidNotCreateAttempts!==true) process.exit(1);"
